# The checks that need the dev Supabase project (PLAN P6.2, D-091): the SQL GTIN helpers, the
# writers, the pipeline e2e (fixture source and job, each run twice) and the Playwright web e2e.
# CI (ci.yml) runs everything that needs no secrets.
#
# Pushes to main only, plus by hand on any branch (`gh workflow run dev-db-checks.yml --ref <branch>`).
# Never on pull_request: forks can't reach the secrets. The logs are public (D-003): the pipeline
# logger redacts keys, Actions masks every secret, and the checks print counts, not row data.
name: Dev DB checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shared with every workflow that writes to the dev project (P6.1), so they queue, not overlap.
concurrency:
  group: dev-db
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
      SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      # The dev-DB checks skip themselves without the key, which would read as green.
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || missing="$missing SUPABASE_DEV_URL"
          [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_DEV_ANON_KEY"
          [ -n "$SUPABASE_DEV_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_DEV_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing Actions secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Each check runs even when an earlier one failed, so one red run shows every failure.
      - name: check:gtin
        run: npm run check:gtin --workspace @sarvis/pipeline

      - name: check:writers
        if: ${{ !cancelled() }}
        run: npm run check:writers --workspace @sarvis/pipeline

      - name: Pipeline e2e
        if: ${{ !cancelled() }}
        run: npm run e2e --workspace @sarvis/pipeline

      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # CI=true (set by Actions): Playwright starts its own Expo web server, retries twice and uses
      # the github reporter. No report or trace artifact: traces hold request headers with the dev
      # URL and the test users' sessions, and artifacts on a public repo are public.
      - name: Playwright e2e
        if: ${{ !cancelled() }}
        run: npm run e2e
